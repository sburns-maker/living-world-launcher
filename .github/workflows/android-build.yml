name: Android build check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Each new PR commit replaces the obsolete build for that PR.
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Locate Android SDK and accept licenses
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager is not installed on runner"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
      - name: Install Android 35 platform and build tools
        run: '"$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"'
      - name: Fetch pinned Apache-2.0 MMS source
        run: bash scripts/fetch-mmslib.sh
      - name: Load persistent test signing key (if configured)
        shell: bash
        env:
          LW_TEST_SIGNING_BUNDLE: ${{ secrets.LW_TEST_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -z "$LW_TEST_SIGNING_BUNDLE" ]; then
            echo "Stable test-signing secret not configured; APK publication disabled." >> "$GITHUB_STEP_SUMMARY"
          else
            umask 077
            DIR="$RUNNER_TEMP/living-world-test-signing"
            mkdir -p "$DIR"
            printf '%s' "$LW_TEST_SIGNING_BUNDLE" | base64 --decode > "$DIR/signing.zip"
            unzip -j -q "$DIR/signing.zip" test-signing.p12 signing.properties -d "$DIR"
            rm -f "$DIR/signing.zip"
            echo "LIVING_WORLD_TEST_SIGNING_DIR=$DIR" >> "$GITHUB_ENV"
            echo "Build uses persistent Android test signature." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: env.LIVING_WORLD_TEST_SIGNING_DIR != ''
        with:
          name: living-world-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
